services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://alart:${POSTGRES_PASSWORD}@db:5432/alart
      PRIVATE_DATA_DIR: /srv/data
      DB_POOL_MAX: "4"
    volumes: [private_data:/srv/data, ./backups:/srv/backups:ro]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "alart.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://alart:${POSTGRES_PASSWORD}@db:5432/alart
      PRIVATE_DATA_DIR: /srv/data
      DB_POOL_MAX: "2"
    volumes: [private_data:/srv/data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: alart
      POSTGRES_DB: alart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alart"]
      interval: 10s
      retries: 10
volumes:
  pg_data:
  caddy_data:
  private_data:
